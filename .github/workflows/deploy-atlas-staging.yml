name: Deploy ATLAS isolated staging Worker
on:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Deploy the isolated staging Worker only (never production)
        type: boolean
        required: true
        default: false
concurrency:
  group: atlas-team-staging-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify-and-deploy-staging:
    if: inputs.deploy_staging == true
    runs-on: ubuntu-latest
    environment: atlas-staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify code and integration tests
        run: npm run check
      - name: Require separate staging database and Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ secrets.TEAM_STAGING_D1_DATABASE_ID }}
        run: |
          set -eu
          test -n "$CF_API_TOKEN" || { echo "::error::Missing Cloudflare deployment credential"; exit 1; }
          printf '%s' "$CF_ACCOUNT_ID" | grep -Eq '^[0-9a-fA-F-]{36}$' || { echo "::error::Invalid Cloudflare account ID"; exit 1; }
          printf '%s' "$STAGING_D1_ID" | grep -Eq '^[0-9a-fA-F-]{36}$' || { echo "::error::A separate TEAM_STAGING_D1_DATABASE_ID is required; refusing to use production D1"; exit 1; }
      - name: Generate isolated staging Worker configuration
        env:
          STAGING_D1_ID: ${{ secrets.TEAM_STAGING_D1_DATABASE_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source=fs.readFileSync('wrangler.toml','utf8');
          const id=process.env.STAGING_D1_ID;
          if(!/^[0-9a-fA-F-]{36}$/.test(id||'')) throw new Error('staging_database_id_invalid');
          let config=source.replace(/^name = "atlas-team"$/m,'name = "atlas-team-staging"');
          config=config.replace(/^TEAM_GITHUB_CERTIFICATION_TASK_ID = .*\n/m,'');
          config=config.replace(/^TEAM_GITHUB_READ_REPOSITORIES = .*\n/m,'');
          config=config.replace(/^TEAM_API_ORIGIN = .*$/m,'TEAM_API_ORIGIN = "https://team-mmy8kteq3-tmbstartkleen-4716s-projects.vercel.app"');
          config=config.replace(/^TEAM_INFERENCE_PROVIDER = .*$/m,'TEAM_INFERENCE_PROVIDER = "cloudflare"\nATLAS_RUNTIME_ENV = "staging"\nTEAM_STAGING_GITHUB_CERTIFICATION_ENABLED = "false"\nTEAM_TOOL_EXECUTOR_ENABLED = "false"\nTEAM_TOOL_EXECUTOR_RELEASED = "false"');
          config=config.replace(/^\[\[d1_databases\]\][\s\S]*?(?=^\[\[|^\[|\s*$)/m,'');
          config += '\n[[d1_databases]]\nbinding = "TEAM_DB"\ndatabase_name = "atlas-team-staging"\ndatabase_id = "'+id+'"\n';
          fs.writeFileSync('wrangler.staging.toml',config);
          NODE
          mkdir -p public && cp index.html public/index.html
      - name: Validate staging bundle without publishing
        run: npx --yes wrangler@4 deploy --config wrangler.staging.toml --dry-run --outdir /tmp/atlas-team-staging-bundle
      - name: Deploy isolated staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.staging.toml
          wranglerVersion: '4'
      - name: Install optional staging-only service credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_EXECUTOR_TOKEN: ${{ secrets.TEAM_STAGING_EXECUTOR_TOKEN }}
          STAGING_GITHUB_READ_TOKEN: ${{ secrets.TEAM_STAGING_GITHUB_READ_TOKEN }}
        run: |
          set -eu
          if [ -n "$STAGING_EXECUTOR_TOKEN" ]; then
            [ "${#STAGING_EXECUTOR_TOKEN}" -ge 32 ] || { echo "::error::Staging executor token too short"; exit 1; }
            printf '%s' "$STAGING_EXECUTOR_TOKEN" | npx --yes wrangler@4 secret put TEAM_EXECUTOR_TOKEN --config wrangler.staging.toml >/dev/null
          fi
          if [ -n "$STAGING_GITHUB_READ_TOKEN" ]; then
            printf '%s' "$STAGING_GITHUB_READ_TOKEN" | npx --yes wrangler@4 secret put TEAM_GITHUB_READ_TOKEN --config wrangler.staging.toml >/dev/null
          fi
          echo "Staging deployed with certification disabled and general executor switches off." >> "$GITHUB_STEP_SUMMARY"
