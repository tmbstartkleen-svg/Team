name: TEAM Recovery Certification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test bounded lease recovery on an isolated SQLite database
        run: |
          set -eu
          node --test tests/d1-lease-recovery.test.mjs tests/d1-receipt-sqlite-integration.test.mjs
      - name: Emit certification evidence
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const summary='## TEAM recovery certification\n\n- Result: PASS\n- Evidence ID: '+process.env.GITHUB_RUN_ID+'\n- Commit: '+process.env.GITHUB_SHA+'\n- Scope: isolated lease-recovery and in-memory SQLite transaction tests\n- Production D1 writes: none\n- Production recovery certification: NOT CERTIFIED by this isolated test\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          NODE
