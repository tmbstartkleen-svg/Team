name: TEAM Provider Live Certification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Perform one bounded, analysis-only model request
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXECUTOR_MODEL: ${{ vars.TEAM_EXECUTOR_MODEL }}
          ALLOWED_MODELS: ${{ vars.TEAM_ALLOWED_MODELS }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const key = process.env.OPENAI_API_KEY || '';
          const model = process.env.EXECUTOR_MODEL || '';
          const allowed = (process.env.ALLOWED_MODELS || '').split(',').map(x => x.trim()).filter(Boolean);
          const report = (state, details) => {
            const safe = String(details || '').replace(/[\r\n|]/g, ' ').slice(0,180);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## TEAM live provider certification\n\n- Result: ' + state + '\n- Detail: ' + safe +
              '\n\nOne limited provider request only. No production task, D1 mutation, secret disclosure, or executor activation.\n');
          };
          async function main() {
            if (!key || !/^[A-Za-z0-9._:-]{1,128}$/.test(model) || !allowed.includes(model)) {
              report('BLOCKED', 'Missing API key or model allowlist mismatch'); process.exitCode = 1; return;
            }
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 20000);
            try {
              const response = await fetch('https://api.openai.com/v1/responses', {
                method: 'POST', signal: controller.signal,
                headers: {'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json'},
                body: JSON.stringify({model, store:false, max_output_tokens:64,
                  instructions:'You are a connectivity probe. Do not use tools. Reply with the exact word READY.',
                  input:'Reply READY.'})
              });
              if (!response.ok) {report('BLOCKED', 'Provider returned HTTP ' + response.status); process.exitCode = 1; return;}
              const size = Number(response.headers.get('content-length') || 0);
              if (size > 32000) throw Error('response_too_large');
              const body = await response.text();
              if (body.length > 32000) throw Error('response_too_large');
              const data = JSON.parse(body);
              const message = (data.output || []).flatMap(x => x.content || []).filter(x => x.type === 'output_text').map(x => x.text || '').join(' ').trim();
              const valid = data.status === 'completed' && !data.error && message.includes('READY');
              report(valid ? 'PASS' : 'BLOCKED', valid ? 'Completed a valid bounded provider response' : 'Response incomplete or missing confirmation');
              if (!valid) process.exitCode = 1;
            } catch(err) {
              report('BLOCKED', ['AbortError','TimeoutError'].includes(err.name) ? 'Provider timeout' : 'Provider request or response validation error');
              process.exitCode = 1;
            } finally {clearTimeout(timer);}
          }
          main().catch(() => {report('BLOCKED', 'Unexpected verification error'); process.exitCode = 1;});
          NODE
