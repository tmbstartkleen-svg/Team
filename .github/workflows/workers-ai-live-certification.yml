name: TEAM Workers AI Live Certification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Cloudflare Workers AI with one bounded inference call
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const summary=(ok,reason)=>fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Workers AI live certification\n\n- Result: '+(ok?'PASS':'BLOCKED')+
            '\n- Detail: '+reason+'\n\nOne small inference request. No production tasks, tokens, model output, or private data logged.\n');
          (async()=>{
            if(!process.env.CF_TOKEN||!process.env.CF_ACCOUNT){summary(false,'Cloudflare credentials missing');process.exitCode=1;return;}
            const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),20000);
            try{
              const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(process.env.CF_ACCOUNT)+'/ai/run/@cf/zai-org/glm-4.7-flash',{
                method:'POST',signal:controller.signal,
                headers:{authorization:'Bearer '+process.env.CF_TOKEN,'content-type':'application/json'},
                body:JSON.stringify({messages:[{role:'user',content:'Say READY.'}],max_tokens:384})
              });
              if(!response.ok){summary(false,'Cloudflare returned HTTP '+response.status+'; verify AI Run permissions, model availability, and free quota');process.exitCode=1;return;}
              const body=await response.text();
              if(body.length>32000)throw Error('response_too_large');
              const parsed=JSON.parse(body);
              const result=parsed.result||parsed;
              const output=result.response||result.output_text||result.choices?.[0]?.message?.content||result.output?.[0]?.content?.[0]?.text||'';
              const valid=parsed.success!==false&&typeof output==='string'&&output.trim().length>0;
              summary(valid,valid?'Live model returned a non-empty text response':'No recognized text response; result fields: '+Object.keys(result).filter(x=>/^[a-z_]{1,24}$/i.test(x)).slice(0,12).join(', '));
              if(!valid)process.exitCode=1;
            }catch(e){summary(false,'Request timeout or invalid response');process.exitCode=1;}
            finally{clearTimeout(timeout);}
          })().catch(()=>{summary(false,'Unexpected check failure');process.exitCode=1;});
          NODE
