name: TEAM One-Window Live Certification
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Owner-approved exact certification task ID (cert-...)'
        required: true
        type: string
      confirm:
        description: 'Type ACTIVATE-EXECUTE-AND-DISABLE to permit one Workers AI task'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: atlas-team-cloudflare-production
  cancel-in-progress: false
jobs:
  certify-and-disable:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: team-live-certification
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TEAM_D1_DATABASE_ID: ${{ secrets.TEAM_D1_DATABASE_ID }}
      TEAM_OWNER_API_TOKEN: ${{ secrets.TEAM_OWNER_API_TOKEN }}
      TEAM_EXECUTOR_TOKEN: ${{ secrets.TEAM_EXECUTOR_TOKEN }}
      TEAM_EXECUTOR_MODEL: ${{ vars.TEAM_EXECUTOR_MODEL }}
      TEAM_ALLOWED_MODELS: ${{ vars.TEAM_ALLOWED_MODELS }}
      TASK_ID: ${{ inputs.task_id }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate explicit approval and stage scoped deployment
        run: |
          set -eu
          npm install --no-audit --no-fund
          npm run check
          mkdir -p public
          cp index.html public/index.html
          node <<'NODE'
          const fs=require('node:fs');
          const id=process.env.TASK_ID||'';
          if(process.env.CONFIRM!=='ACTIVATE-EXECUTE-AND-DISABLE')throw Error('explicit_live_execution_confirmation_required');
          if(!/^cert-[A-Za-z0-9_-]{8,120}$/.test(id))throw Error('invalid_certification_task_id');
          for(const name of ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','TEAM_D1_DATABASE_ID','TEAM_OWNER_API_TOKEN','TEAM_EXECUTOR_TOKEN']){
            if(!process.env[name]||process.env[name].length<32)throw Error('missing_required_credential_'+name);
          }
          if(!/^[a-fA-F0-9-]{36}$/.test(process.env.TEAM_D1_DATABASE_ID))throw Error('invalid_d1_database_id');
          const model=process.env.TEAM_EXECUTOR_MODEL||'';
          const allowed=(process.env.TEAM_ALLOWED_MODELS||'').split(',').map(x=>x.trim()).filter(Boolean);
          if(Boolean(model)!==Boolean(allowed.length)||model&&(!/^[a-zA-Z0-9._:-]{1,128}$/.test(model)||!allowed.includes(model)))throw Error('model_configuration_mismatch');
          const config=fs.readFileSync('wrangler.toml','utf8');
          if(!config.includes('TEAM_INFERENCE_PROVIDER = "cloudflare"'))throw Error('cloudflare_provider_not_configured');
          const db='\n[[d1_databases]]\nbinding = "TEAM_DB"\ndatabase_name = "atlas-team-data"\ndatabase_id = '+JSON.stringify(process.env.TEAM_D1_DATABASE_ID)+'\n';
          const models=model?'\nTEAM_EXECUTOR_MODEL = '+JSON.stringify(model)+'\nTEAM_ALLOWED_MODELS = '+JSON.stringify(allowed.join(','))+'\n':'';
          // Deploy baseline and temporary files from the same checkout, with identical D1/AI bindings.
          fs.writeFileSync('wrangler.baseline.toml',config.replace('TEAM_INFERENCE_PROVIDER = "cloudflare"','TEAM_INFERENCE_PROVIDER = "cloudflare"'+models)+db);
          const expiry=new Date(Date.now()+7*60*1000).toISOString();
          const scoped='\nTEAM_EXECUTOR_ENABLED = "true"\nTEAM_EXECUTOR_CERTIFICATION_MODE = "true"\nTEAM_EXECUTOR_CERTIFICATION_TASK_ID = '+JSON.stringify(id)+'\nTEAM_EXECUTOR_CERTIFICATION_EXPIRES_AT = '+JSON.stringify(expiry)+'\nTEAM_EXECUTOR_GENERAL_RELEASED = "false"';
          fs.writeFileSync('wrangler.scoped.toml',config.replace('TEAM_INFERENCE_PROVIDER = "cloudflare"','TEAM_INFERENCE_PROVIDER = "cloudflare"'+models+scoped)+db);
          NODE
      - name: Verify task is explicitly approved and unused before any deployment
        run: |
          node <<'NODE'
          (async()=>{
            const base='https://atlas-team.tmbstartkleen.workers.dev';
            const headers={authorization:'Bearer '+process.env.TEAM_OWNER_API_TOKEN};
            const get=async(path)=>{const r=await fetch(base+path,{headers,signal:AbortSignal.timeout(15000)});return {status:r.status,data:await r.json()}};
            const task=await get('/api/owner-task-preflight?taskId='+encodeURIComponent(process.env.TASK_ID));
            const evidence=await get('/api/task-certification?taskId='+encodeURIComponent(process.env.TASK_ID));
            if(task.status!==200||task.data?.ok!==true||task.data.taskId!==process.env.TASK_ID||task.data.ownerApproved!==true||task.data.claimable!==true||task.data.state!=='queued'||task.data.attemptCount!==0||task.data.assignedPersona!=='release-review')throw Error('approved_clean_task_required');
            if(evidence.status!==200||evidence.data?.ok!==true||evidence.data.receiptCount!==0||evidence.data.taskState!=='queued'||evidence.data.approvalRecorded!==true)throw Error('existing_receipt_or_missing_approval');
          })().catch(e=>{console.error('BLOCKED:',e.message);process.exitCode=1});
          NODE
      - name: Activate only the pinned task for seven minutes
        id: activation
        run: |
          set -eu
          npx --yes wrangler@4 deploy --config wrangler.scoped.toml
          echo "activated=true" >> "$GITHUB_OUTPUT"
      - name: Execute once and independently verify durable evidence
        if: steps.activation.outputs.activated == 'true'
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const base='https://atlas-team.tmbstartkleen.workers.dev',id=process.env.TASK_ID;
            const get=async(path,token)=>{
              const r=await fetch(base+path,{headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(18000)});
              return {status:r.status,data:await r.json().catch(()=>({}))};
            };
            const ready=await get('/api/internal-executor-certification-preflight?taskId='+encodeURIComponent(id),process.env.TEAM_EXECUTOR_TOKEN);
            if(ready.status!==200||ready.data.ready!==true||ready.data.checks?.withinCertificationWindow!==true||ready.data.checks?.generalReleaseOff!==true||ready.data.checks?.exactTaskPinned!==true)throw Error('scoped_preflight_failed_'+ready.status);
            const response=await fetch(base+'/api/internal-executor-run',{
              method:'POST',headers:{authorization:'Bearer '+process.env.TEAM_EXECUTOR_TOKEN,'content-type':'application/json'},
              body:JSON.stringify({taskId:id}),signal:AbortSignal.timeout(90000)
            });
            const result=await response.json().catch(()=>({}));
            if(response.status!==200||result.ok!==true||result.state!=='verified'||result.outputType!=='analysis-only'||result.externalActionsPerformed!==false||typeof result.receiptId!=='string')throw Error('single_execution_failed_http_'+response.status);
            const evidence=await get('/api/task-certification?taskId='+encodeURIComponent(id),process.env.TEAM_OWNER_API_TOKEN);
            if(evidence.status!==200||evidence.data.taskState!=='verified'||evidence.data.approvalRecorded!==true||evidence.data.evidenceRecorded!==true||evidence.data.receiptCount!==1||!evidence.data.receiptIds?.includes(result.receiptId))throw Error('persisted_receipt_mismatch');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## One-task AI certification\n\n- Live AI result: VERIFIED\n- Exactly one D1 receipt verified independently\n- External actions: none\n- General release: disabled\n');
          })().catch(e=>{console.error('BLOCKED:',e.message);process.exitCode=1});
          NODE
      - name: Always restore disabled production configuration
        if: always() && steps.activation.outcome != 'skipped'
        run: |
          set -eu
          npx --yes wrangler@4 deploy --config wrangler.baseline.toml
          node <<'NODE'
          (async()=>{
            const base='https://atlas-team.tmbstartkleen.workers.dev';
            const response=await fetch(base+'/api/internal-executor-run',{
              method:'POST',headers:{authorization:'Bearer '+process.env.TEAM_EXECUTOR_TOKEN,'content-type':'application/json'},
              body:JSON.stringify({taskId:process.env.TASK_ID}),signal:AbortSignal.timeout(20000)
            });
            const body=await response.json().catch(()=>({}));
            if(response.status!==503||body.error!=='executor_disabled')throw Error('disabled_executor_not_verified');
          })().catch(e=>{console.error('RESTORE VERIFICATION FAILED:',e.message);process.exitCode=1});
          NODE
          echo 'Production executor restored to disabled and verified by authenticated denial' >> "$GITHUB_STEP_SUMMARY"
