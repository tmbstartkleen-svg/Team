name: Deploy TEAM to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 14 * * *'
concurrency:
  group: atlas-team-cloudflare-production
  cancel-in-progress: true
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Stage static frontend
        run: mkdir -p public && cp index.html public/index.html
      - name: Configure dedicated TEAM D1 binding when provisioned
        env:
          TEAM_D1_DATABASE_ID: ${{ secrets.TEAM_D1_DATABASE_ID }}
        run: |
          if [ -n "$TEAM_D1_DATABASE_ID" ]; then
            if ! printf '%s' "$TEAM_D1_DATABASE_ID" | grep -Eq '^[0-9a-fA-F-]{36}$'; then
              echo "::error::Invalid TEAM_D1_DATABASE_ID format"
              exit 1
            fi
            printf '\n[[d1_databases]]\nbinding = "TEAM_DB"\ndatabase_name = "atlas-team-data"\ndatabase_id = "%s"\n' "$TEAM_D1_DATABASE_ID" >> wrangler.toml
            echo "TEAM D1 binding configured" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "TEAM D1 not provisioned; persistent storage inactive" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify Cloudflare Worker can bundle without publishing
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/atlas-team-bundle
      - name: Check Cloudflare deployment credentials
        id: credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment not configured; add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to TEAM."
          fi
      - name: Require Cloudflare credentials
        if: steps.credentials.outputs.ready != 'true' && github.event_name != 'schedule'
        run: |
          echo '## Cloudflare production: BLOCKED' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verification passed; publication cannot proceed until TEAM repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are configured.' >> "$GITHUB_STEP_SUMMARY"
          echo '::error::Cloudflare credentials missing; this deployment job must not report success.'
          exit 1
      - name: Scheduled credential readiness report
        if: steps.credentials.outputs.ready != 'true' && github.event_name == 'schedule'
        run: |
          echo '## Cloudflare still awaiting credentials' >> "$GITHUB_STEP_SUMMARY"
          echo 'Scheduled check only; no deployment attempted.' >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy Cloudflare Worker
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: '4'
      - name: Configure owner-only API token when explicitly provided
        if: steps.credentials.outputs.ready == 'true' && success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEAM_OWNER_API_TOKEN: ${{ secrets.TEAM_OWNER_API_TOKEN }}
        run: |
          set -eu
          if [ -n "$TEAM_OWNER_API_TOKEN" ]; then
            if [ "${#TEAM_OWNER_API_TOKEN}" -lt 32 ]; then
              echo '::error::TEAM_OWNER_API_TOKEN must be at least 32 characters'; exit 1
            fi
            printf '%s' "$TEAM_OWNER_API_TOKEN" | npx --yes wrangler@4 secret put TEAM_OWNER_API_TOKEN
            echo 'Owner collaboration secret installed on Cloudflare Worker' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Owner collaboration remains disabled; TEAM_OWNER_API_TOKEN not configured' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify deployed D1 binding when configured
        if: steps.credentials.outputs.ready == 'true' && success()
        env:
          TEAM_D1_DATABASE_ID: ${{ secrets.TEAM_D1_DATABASE_ID }}
        run: |
          set -eu
          if [ -z "$TEAM_D1_DATABASE_ID" ]; then
            echo 'TEAM D1 remains unconfigured; readiness probe not required' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          URL='https://atlas-team.tmbstartkleen.workers.dev/api/database-readiness'
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$URL" > /tmp/team-d1-readiness.json
          node - <<'NODE'
          const r=require('/tmp/team-d1-readiness.json');
          if(r.ok!==true||r.database?.bindingConfigured!==true)throw Error('TEAM D1 binding is not active on the deployed Worker');
          if(r.database.schemaVerified!==true)throw Error('TEAM D1 exists but required migrations are incomplete');
          console.log('TEAM D1 binding and schema verified on deployed Worker');
          NODE
          echo 'TEAM D1 binding and schema verified on live Worker' >> "$GITHUB_STEP_SUMMARY"
      - name: Report executor schema and launch readiness without implying certification
        if: steps.credentials.outputs.ready == 'true' && success()
        run: |
          set -eu
          URL='https://atlas-team.tmbstartkleen.workers.dev/api/launch-readiness'
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$URL" > /tmp/team-launch-readiness.json
          node - <<'NODE'
          const r=require('/tmp/team-launch-readiness.json');
          if(r.ok!==true||!Array.isArray(r.checks))throw Error('Launch readiness endpoint is unavailable or invalid');
          const schema=r.checks.find(c=>c.id==='executor-database-schema');
          if(!schema)throw Error('Missing required executor schema readiness check');
          const summary=[
            '## ATLAS TEAM operational release assessment',
            '| Gate | Status |',
            '| --- | --- |',
            ...r.checks.map(c=>'| '+c.id+' | '+(c.ready?'PASS':c.required?'BLOCKED':'OPTIONAL')+' |'),
            '',
            '**Beta certified: '+(r.betaReady===true?'YES':'NO')+'**',
            'A successful deployment is not evidence of autonomous AI execution.'
          ].join('\n');
          require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary+'\n');
          if(r.betaReady!==true)console.log('Deployment reachable; operational beta NOT certified');
          NODE
      - name: Verify published Cloudflare edge
        if: steps.credentials.outputs.ready == 'true' && success()
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          SUBDOMAIN=$(curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/subdomain" | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const r=JSON.parse(s);if(!r.success||!r.result?.subdomain)process.exit(1);process.stdout.write(r.result.subdomain)})')
          URL="https://atlas-team.$SUBDOMAIN.workers.dev/__team/health"
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$URL" | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const r=JSON.parse(s);if(r.ok!==true||r.hosting!=="cloudflare")process.exit(1)})'
          echo "Verified edge health at $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify private collaboration rejects unauthenticated requests
        if: steps.credentials.outputs.ready == 'true' && success()
        run: |
          set -eu
          URL='https://atlas-team.tmbstartkleen.workers.dev/api/owner-collaboration?projectId=security-probe'
          for method in GET POST; do
            CODE=$(curl --silent --show-error --output /tmp/team-auth-response.json --write-out '%{http_code}' --request "$method" --header 'content-type: application/json' --data-binary '{}' "$URL")
            if [ "$CODE" != '401' ]; then
              echo "::error::Unauthenticated $method returned HTTP $CODE instead of 401"
              exit 1
            fi
            node -e 'const x=require("/tmp/team-auth-response.json");if(x.ok!==false||x.error!=="unauthorized")process.exit(1)'
          done
          echo 'Unauthenticated collaboration GET and POST correctly denied.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify configured owner can read collaboration without changing data
        if: steps.credentials.outputs.ready == 'true' && success()
        env:
          TEAM_OWNER_API_TOKEN: ${{ secrets.TEAM_OWNER_API_TOKEN }}
        run: |
          set -eu
          if [ -z "$TEAM_OWNER_API_TOKEN" ]; then
            echo 'Owner token not configured; authenticated smoke test deferred' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          CODE=$(curl --silent --show-error --output /tmp/team-owner-read.json --write-out '%{http_code}' --get 'https://atlas-team.tmbstartkleen.workers.dev/api/owner-collaboration' --data-urlencode 'projectId=owner-auth-smoke-probe' --header "Authorization: Bearer $TEAM_OWNER_API_TOKEN")
          if [ "$CODE" = '503' ]; then
            echo '::error::Authenticated owner request could not access D1'; exit 1
          fi
          if [ "$CODE" != '200' ]; then
            echo "::error::Authenticated owner request returned HTTP $CODE"; exit 1
          fi
          node -e 'const x=require("/tmp/team-owner-read.json");if(x.ok!==true||!Array.isArray(x.messages))process.exit(1)'
          echo 'Authenticated read-only owner collaboration smoke check passed' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify private project API denies unauthenticated access
        if: steps.credentials.outputs.ready == 'true' && success()
        run: |
          set -eu
          URL='https://atlas-team.tmbstartkleen.workers.dev/api/owner-projects'
          for method in GET POST; do
            CODE=$(curl --silent --show-error --output /tmp/team-project-denial.json --write-out '%{http_code}' --request "$method" --header 'content-type: application/json' --data-binary '{}' "$URL")
            if [ "$CODE" != '401' ]; then echo "::error::Anonymous projects $method returned $CODE"; exit 1; fi
            node -e 'const x=require("/tmp/team-project-denial.json");if(x.error!=="unauthorized")process.exit(1)'
          done
          echo 'Anonymous project listing and creation correctly denied.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report Cloudflare publication
        if: steps.credentials.outputs.ready == 'true' && success()
        run: |
          echo '## Cloudflare publication action completed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Confirm the Worker URL and /__team/health endpoint before calling Cloudflare primary.' >> "$GITHUB_STEP_SUMMARY"
