name: ATLAS isolated staging live HTTP smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-staging-readonly-http-smoke
  cancel-in-progress: false
jobs:
  staging-http-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check isolated staging Worker health and database readiness (GET only)
        env:
          STAGING_ORIGIN: https://atlas-team-staging.tmbstartkleen.workers.dev
        run: |
          set -eu
          health_status="$(curl --silent --show-error --max-redirs 0 --connect-timeout 5 --max-time 15 --output /tmp/atlas-staging-health.json --write-out '%{http_code}' "$STAGING_ORIGIN/__team/health")"
          [ "$health_status" = 200 ] || { echo "::error::Staging edge health HTTP $health_status"; exit 1; }
          node -e '
            const fs=require("node:fs");
            const d=JSON.parse(fs.readFileSync("/tmp/atlas-staging-health.json","utf8"));
            if(d.ok!==true || d.service!=="atlas-team-edge" || d.hosting!=="cloudflare") process.exit(1);
            console.log("ATLAS Cloudflare edge health: PASS");
          '
          database_status="$(curl --silent --show-error --max-redirs 0 --connect-timeout 5 --max-time 15 --output /tmp/atlas-staging-db-readiness.json --write-out '%{http_code}' "$STAGING_ORIGIN/api/database-readiness")"
          [ "$database_status" = 200 ] || { echo "::error::Staging database readiness HTTP $database_status"; exit 1; }
          node -e '
            const fs=require("node:fs");
            const d=JSON.parse(fs.readFileSync("/tmp/atlas-staging-db-readiness.json","utf8"));
            if(d.ok!==true || d.hosting!=="cloudflare" || d.agentsActive!==false || !d.database || typeof d.database!=="object") process.exit(1);
            console.log("ATLAS Cloudflare database readiness: PASS (agents inactive)");
          '
          echo "Cloudflare Worker health and database readiness: PASS (GET-only)." >> "$GITHUB_STEP_SUMMARY"
          echo "Staging **identity and binding** must additionally be confirmed by the Cloudflare Worker settings API; these HTTP endpoints do not expose the runtime environment or D1 UUID." >> "$GITHUB_STEP_SUMMARY"
