name: Audit TEAM Production D1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-production-d1.yml'
      - 'scripts/inspect-remote-d1.mjs'
permissions:
  contents: read
jobs:
  inspect-d1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Require Cloudflare and dedicated database credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEAM_D1_DATABASE_ID: ${{ secrets.TEAM_D1_DATABASE_ID }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$TEAM_D1_DATABASE_ID" || { echo '::error::Missing TEAM D1 credentials'; exit 1; }
          case "$TEAM_D1_DATABASE_ID" in *[!0-9a-fA-F-]*|'') echo '::error::Invalid D1 identifier'; exit 1;; esac
          printf '\n[[d1_databases]]\nbinding = "TEAM_DB"\ndatabase_name = "atlas-team-data"\ndatabase_id = "%s"\n' "$TEAM_D1_DATABASE_ID" >> wrangler.toml
      - name: Read remote TEAM tables and task columns only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npx --yes wrangler@4 d1 execute atlas-team-data --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name LIKE 'team_%' ORDER BY name" > /tmp/team-tables.json
          npx --yes wrangler@4 d1 execute atlas-team-data --remote --json --command "PRAGMA table_info('team_tasks')" > /tmp/team-columns.json
          node scripts/inspect-remote-d1.mjs /tmp/team-tables.json /tmp/team-columns.json
