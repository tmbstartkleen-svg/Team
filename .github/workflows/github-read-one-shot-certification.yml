name: TEAM GitHub Read One-Shot Certification
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN-OWNER-APPROVED-GITHUB-READ'
        required: true
        type: string
permissions:
  contents: read
jobs:
  certify-read:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: team-live-certification
    steps:
      - name: Run only the owner-approved GitHub repository read
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXECUTOR_TOKEN: ${{ secrets.TEAM_EXECUTOR_TOKEN }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            if(process.env.CONFIRM!=='RUN-OWNER-APPROVED-GITHUB-READ')throw Error('explicit_confirmation_required');
            if(!process.env.EXECUTOR_TOKEN||process.env.EXECUTOR_TOKEN.length<32)throw Error('service_credential_missing');
            const base='https://atlas-team.tmbstartkleen.workers.dev';
            const headers={authorization:'Bearer '+process.env.EXECUTOR_TOKEN,'content-type':'application/json'};
            const body=JSON.stringify({taskId:'cert-github-read-20261018',stepId:'cert-github-repository-read'});
            const post=async()=>{const r=await fetch(base+'/api/internal-github-certification',{method:'POST',headers,body,signal:AbortSignal.timeout(20000)});return {status:r.status,data:await r.json()}};
            const first=await post();
            if(first.status!==200||first.data?.ok!==true||first.data?.durable!==true||first.data?.executed!==true)throw Error('first_tool_execution_unverified_'+first.status+'_'+(first.data?.error||first.data?.status||'unknown')+'_'+(first.data?.stage||'none'));
            const second=await post();
            if(second.status!==409||second.data?.ok!==false||second.data?.executed!==false)throw Error('replay_not_rejected');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'GitHub read confirmed; durable receipt recorded; duplicate execution rejected. General executor release remains disabled.\n');
          })().catch(e=>{console.error(String(e.message).replace(/[^a-zA-Z0-9_-]/g,'_'));process.exitCode=1});
          NODE
