name: TEAM Controlled Live Task Certification
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Already owner-approved dedicated certification task ID (cert-...)'
        required: true
        type: string
      confirm:
        description: 'Type EXECUTE-APPROVED-CERT-TASK to authorize one real Workers AI task'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: atlas-team-cloudflare-production
  cancel-in-progress: false
jobs:
  execute-once:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: team-live-certification
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify explicit authorization and pristine approved task before deploying
        env:
          TASK_ID: ${{ inputs.task_id }}
          CONFIRM: ${{ inputs.confirm }}
          OWNER_TOKEN: ${{ secrets.TEAM_OWNER_API_TOKEN }}
          EXECUTOR_TOKEN: ${{ secrets.TEAM_EXECUTOR_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEAM_D1_DATABASE_ID: ${{ secrets.TEAM_D1_DATABASE_ID }}
        run: |
          node <<'NODE'
          const id=process.env.TASK_ID||'';
          const nonempty=['OWNER_TOKEN','EXECUTOR_TOKEN','CF_API_TOKEN','CF_ACCOUNT_ID','TEAM_D1_DATABASE_ID'];
          if(process.env.CONFIRM!=='EXECUTE-APPROVED-CERT-TASK'||!/^cert-[A-Za-z0-9_-]{8,120}$/.test(id))throw Error('explicit_certification_confirmation_required');
          if(nonempty.some(k=>!(process.env[k]||'').trim()))throw Error('missing_credential_or_d1_binding');
          if(process.env.OWNER_TOKEN.length<32||process.env.EXECUTOR_TOKEN.length<32||!/^[0-9a-fA-F-]{36}$/.test(process.env.TEAM_D1_DATABASE_ID))throw Error('invalid_secrets_or_d1_id');
          (async()=>{
            const base='https://atlas-team.tmbstartkleen.workers.dev';
            const token=process.env.OWNER_TOKEN;
            const get=async path=>{
              const response=await fetch(base+path,{headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
              return {status:response.status,data:await response.json()};
            };
            const [pre,cert]=await Promise.all([
              get('/api/owner-task-preflight?taskId='+encodeURIComponent(id)),
              get('/api/task-certification?taskId='+encodeURIComponent(id))
            ]);
            if(pre.status!==200||pre.data.ok!==true||pre.data.taskId!==id||pre.data.state!=='queued'||pre.data.ownerApproved!==true||pre.data.claimable!==true||pre.data.attemptCount!==0||pre.data.assignedPersona!=='release-review')throw Error('approved_task_preflight_failed');
            if(cert.status!==200||cert.data.ok!==true||cert.data.taskId!==id||cert.data.taskState!=='queued'||cert.data.approvalRecorded!==true||cert.data.receiptCount!==0)throw Error('approved_task_receipt_preflight_failed');
            const denied=await fetch(base+'/api/internal-executor-run',{method:'POST',headers:{authorization:'Bearer '+process.env.EXECUTOR_TOKEN,'content-type':'application/json'},body:JSON.stringify({taskId:id}),signal:AbortSignal.timeout(20000)});
            const d=await denied.json();
            if(denied.status!==503||d.error!=='executor_disabled')throw Error('baseline_executor_not_disabled');
          })().catch(e=>{console.error(String(e.message).replace(/[^a-zA-Z0-9_-]/g,'_'));process.exitCode=1});
          NODE
      - name: Prepare isolated certification deployment and recovery baseline
        env:
          TEAM_D1_DATABASE_ID: ${{ secrets.TEAM_D1_DATABASE_ID }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -eu
          mkdir -p public
          cp index.html public/index.html
          printf '\n[[d1_databases]]\nbinding = "TEAM_DB"\ndatabase_name = "atlas-team-data"\ndatabase_id = "%s"\n' "$TEAM_D1_DATABASE_ID" >> wrangler.toml
          cp wrangler.toml /tmp/team-certified-baseline.toml
          node <<'NODE'
          const fs=require('node:fs'),p='wrangler.toml';
          let t=fs.readFileSync(p,'utf8');
          if(!t.includes('[vars]')||/TEAM_EXECUTOR_(?:ENABLED|CERTIFICATION_MODE|CERTIFICATION_TASK_ID|CERTIFICATION_EXPIRES_AT|GENERAL_RELEASED)\s*=/.test(t))throw Error('unexpected_executor_flags_in_baseline');
          const id=process.env.TASK_ID;
          const expiry=new Date(Date.now()+10*60*1000).toISOString();
          const vars=['TEAM_EXECUTOR_ENABLED = "true"','TEAM_EXECUTOR_CERTIFICATION_MODE = "true"','TEAM_EXECUTOR_CERTIFICATION_TASK_ID = '+JSON.stringify(id),'TEAM_EXECUTOR_GENERAL_RELEASED = "false"','TEAM_EXECUTOR_CERTIFICATION_EXPIRES_AT = '+JSON.stringify(expiry)].join('\n');
          t=t.replace('[vars]','[vars]\n'+vars);
          fs.writeFileSync(p,t);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n- Short-lived certification permission expires within ten minutes of preparation, even if rollback fails.\n');
          NODE
          touch /tmp/team-cert-activation-attempted
      - name: Deploy temporary exact-task certification scope
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Owner-approved controlled certification
        env:
          TASK_ID: ${{ inputs.task_id }}
          CONFIRM: ${{ inputs.confirm }}
          OWNER_TOKEN: ${{ secrets.TEAM_OWNER_API_TOKEN }}
          EXECUTOR_TOKEN: ${{ secrets.TEAM_EXECUTOR_TOKEN }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const base='https://atlas-team.tmbstartkleen.workers.dev';
          const taskId=process.env.TASK_ID||'';
          const summary=(result,detail)=>fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Controlled live task certification\n\n- Result: '+result+'\n- Detail: '+detail+
            '\n- Production action: at most one explicitly owner-approved analysis-only task\n- No task creation, approval, or recovery actions from this workflow\n');
          const get=async(path,token)=>{
            const res=await fetch(base+path,{headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
            const body=await res.json().catch(()=>({}));
            return {status:res.status,body};
          };
          (async()=>{
            if(process.env.CONFIRM!=='EXECUTE-APPROVED-CERT-TASK')throw Error('explicit_confirmation_required');
            if(!/^cert-[A-Za-z0-9_-]{8,120}$/.test(taskId))throw Error('invalid_certification_task_id');
            if((process.env.OWNER_TOKEN||'').length<32||(process.env.EXECUTOR_TOKEN||'').length<32)throw Error('required_service_secrets_missing');
            const pre=await get('/api/owner-task-preflight?taskId='+encodeURIComponent(taskId),process.env.OWNER_TOKEN);
            if(pre.status!==200||pre.body.ok!==true||pre.body.taskId!==taskId||pre.body.ownerApproved!==true||pre.body.claimable!==true||pre.body.state!=='queued')throw Error('task_not_owner_approved_and_claimable');
            const before=await get('/api/task-certification?taskId='+encodeURIComponent(taskId),process.env.OWNER_TOKEN);
            if(before.status!==200||before.body.ok!==true||before.body.taskId!==taskId||before.body.receiptCount!==0||before.body.taskState!=='queued')throw Error('test_task_not_clean');
            // Independently verify exact-task, provider, schema, and disabled general release
            // before issuing the single execution request.
            const scoped=await get('/api/internal-executor-certification-preflight?taskId='+encodeURIComponent(taskId),process.env.EXECUTOR_TOKEN);
            if(scoped.status!==200||scoped.body.ok!==true||scoped.body.ready!==true||
               scoped.body.checks?.generalReleaseOff!==true||scoped.body.checks?.withinCertificationWindow!==true||scoped.body.checks?.exactTaskPinned!==true||
               scoped.body.checks?.cloudflareProvider!==true||scoped.body.checks?.taskApproved!==true)
              throw Error('certification_executor_preflight_not_ready_http_'+scoped.status);
            // Only the exact task is temporarily activated; cleanup restores the baseline.
            const res=await fetch(base+'/api/internal-executor-run',{
              method:'POST',
              headers:{authorization:'Bearer '+process.env.EXECUTOR_TOKEN,'content-type':'application/json'},
              body:JSON.stringify({taskId}),
              signal:AbortSignal.timeout(90000)
            });
            const outcome=await res.json().catch(()=>({}));
            if(res.status!==200||outcome.ok!==true||outcome.state!=='verified'||outcome.outputType!=='analysis-only'||outcome.externalActionsPerformed!==false||typeof outcome.receiptId!=='string')throw Error('execution_not_verified_http_'+res.status);
            const after=await get('/api/task-certification?taskId='+encodeURIComponent(taskId),process.env.OWNER_TOKEN);
            if(after.status!==200||after.body.ok!==true||after.body.taskId!==taskId||after.body.taskState!=='verified'||after.body.approvalRecorded!==true||after.body.evidenceRecorded!==true||after.body.receiptCount!==1||!after.body.receiptIds?.includes(outcome.receiptId))throw Error('receipt_evidence_mismatch');
            summary('PASS','Single approved task verified with matching persisted D1 receipt; production release is not certified');
          })().catch(error=>{
            summary('BLOCKED',String(error.message).replace(/[^A-Za-z0-9_-]/g,'_').slice(0,110));
            process.exitCode=1;
          });
          NODE
      - name: Restore disabled production executor regardless of test outcome
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXECUTOR_TOKEN: ${{ secrets.TEAM_EXECUTOR_TOKEN }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -eu
          if [ ! -f /tmp/team-cert-activation-attempted ]; then
            echo 'No temporary Worker deployment attempted' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp /tmp/team-certified-baseline.toml wrangler.toml
          npx --yes wrangler@4 deploy
          node <<'NODE'
          (async()=>{
            const response=await fetch('https://atlas-team.tmbstartkleen.workers.dev/api/internal-executor-run',{
              method:'POST',headers:{authorization:'Bearer '+process.env.EXECUTOR_TOKEN,'content-type':'application/json'},
              body:JSON.stringify({taskId:process.env.TASK_ID}),signal:AbortSignal.timeout(20000)});
            const data=await response.json();
            if(response.status!==503||data.error!=='executor_disabled')throw Error('post_certification_executor_not_disabled');
            require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n- Rollback: PASS; executor disabled on production after certification.\n');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
