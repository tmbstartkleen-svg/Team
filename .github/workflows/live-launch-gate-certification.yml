name: TEAM Live Launch Gate Certification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check deployed launch gate without writes
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const response=await fetch('https://atlas-team.tmbstartkleen.workers.dev/api/launch-readiness',{signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw Error('launch_readiness_http_'+response.status);
            const body=await response.json();
            if(body.ok!==true||!Array.isArray(body.checks))throw Error('invalid_launch_readiness_payload');
            const required=body.checks.filter(x=>x.required===true);
            const incomplete=required.filter(x=>x.ready!==true).map(x=>x.id);
            const safe=body.productionOperational===false&&body.agentsActive===false;
            const result=safe?'PASS':'BLOCKED';
            const summary='## TEAM live launch gate certification\n\n- Result: '+result+
              '\n- Production operational: '+String(body.productionOperational)+
              '\n- Agents active: '+String(body.agentsActive)+
              '\n- Required gates still open: '+(incomplete.length?incomplete.join(', '):'none')+
              '\n- Mode: read-only; no AI calls, tasks, or database writes\n';
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
            if(!safe)process.exitCode=1;
          })().catch(error=>{fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## TEAM live launch gate certification\n\n- Result: BLOCKED\n- Detail: '+String(error.message).replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,100)+'\n');process.exitCode=1});
          NODE
