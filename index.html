<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATLAS TEAM | Workforce OS</title>

</style></head><body><div class="shell"><aside><h2>ATLAS</h2><small>TEAM • AI WORKFORCE OS</small><div class="nav" id="nav"></div><p class="muted" style="margin-top:50px">Local prototype • No cloud model execution connected</p></aside><main><header><div><span class="ey">EXECUTIVE INTELLIGENCE WORKSPACE</span><h1 id="heading">Command Center</h1><p id="subtitle">Independent workforce orchestration workspace</p></div><button class="button" id="export">Export data</button></header><div class="metrics" id="metrics"></div><section id="view"></section></main></div>
<script>
const roles=['Chief Architect','Team Assembler','Program Manager','Research Director','Data Analyst','Software Engineer','Product Designer','QA Engineer','Security Reviewer','Deployment Engineer','Model Steward','Offline Engineer','Integration Engineer','Compliance Auditor','Financial Analyst','Sales Strategist','Operations Manager','Documentation Lead'];
const defaults={projects:[{name:'TEAM Platform',status:'In progress'},{name:'Multi-model Fabric',status:'Planned'},{name:'Offline Agent Runtime',status:'Planned'}],tasks:[{title:'Implement real model connections',agent:'Model Steward',priority:'High',status:'Queued'},{title:'Deploy independent TEAM runtime',agent:'Deployment Engineer',priority:'High',status:'Queued'}]};
let state;try{state=JSON.parse(localStorage.getItem('atlas-team-v2'))||localStorage.getItem('atlas-team-v1')&&JSON.parse(localStorage.getItem('atlas-team-v1'))||structuredClone(defaults)}catch{state=structuredClone(defaults)}
if(!Array.isArray(state.projects))state.projects=[];
if(!Array.isArray(state.tasks))state.tasks=[];
if(!Array.isArray(state.activity))state.activity=[];
state.tasks=state.tasks.map((t,i)=>({...t,id:t.id||'task-'+i,approval:t.approval||'not-requested'}));
const audit=(kind,description)=>{state.activity.unshift({kind,description,at:new Date().toISOString()});state.activity=state.activity.slice(0,200)};
const signals={
'Chief Architect':['architecture','system','roadmap','dependency','design'],
'Team Assembler':['persona','agent','team','workforce'],
'Program Manager':['milestone','plan','schedule','delivery'],
'Research Director':['research','investigate','source','evidence'],
'Data Analyst':['data','analysis','metrics','report'],
'Software Engineer':['code','software','bug','feature','backend','frontend'],
'Product Designer':['ui','ux','interface','layout','visual','accessibility'],
'QA Engineer':['test','quality','regression','verify'],
'Security Reviewer':['security','permissions','secrets','auth'],
'Deployment Engineer':['deploy','vercel','release','production','build','github'],
'Model Steward':['model','gpt','llm','routing','inference','provider'],
'Offline Engineer':['offline','local','device','fallback'],
'Integration Engineer':['connector','integration','webhook','sync','api'],
'Compliance Auditor':['compliance','audit','policy','regulatory'],
'Financial Analyst':['budget','cost','revenue','finance','pricing'],
'Sales Strategist':['sales','customers','leads','proposal'],
'Operations Manager':['operations','process','workflow','handoff'],
'Documentation Lead':['documentation','write','guide','manual']
};
function propose(title){const words=new Set(String(title||'').toLowerCase().match(/[a-z0-9-]+/g)||[]);return roles.map(name=>({name,matches:(signals[name]||[]).filter(w=>words.has(w))})).filter(x=>x.matches.length).sort((a,b)=>b.matches.length-a.matches.length||a.name.localeCompare(b.name)).slice(0,4)}

const save=()=>localStorage.setItem('atlas-team-v2',JSON.stringify(state));
const views={overview:'Command Center',workforce:'Workforce',projects:'Projects',tasks:'Task Queue',models:'Model Fabric',audit:'Governance',routing:'Task Routing',execution:'AI Execution',server:'Server Tasks',planner:'Mission Planner',readiness:'Release Readiness',recovery:'Recovery Center',microsoft:'Microsoft 365',gmail:'Gmail Side Projects',personalization:'My Preferences',help:'AI Help',collaboration:'Team Collaboration',sports:'Sports Intelligence'};
let current='overview';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PREF_KEY='atlas-team-preferences-v1';
function loadPreferences(){try{const p=JSON.parse(localStorage.getItem(PREF_KEY)||'{}');return {enabled:p.enabled===true,tone:['concise','detailed','professional'].includes(p.tone)?p.tone:'concise',layout:['cards','tables'].includes(p.layout)?p.layout:'cards',focus:String(p.focus||'').slice(0,240),usage:Number.isFinite(p.usage)?Math.max(0,Math.min(p.usage,10000)):0}}catch{return {enabled:false,tone:'concise',layout:'cards',focus:'',usage:0}}}
let preferences=loadPreferences();
function savePreferences(){localStorage.setItem(PREF_KEY,JSON.stringify(preferences))}
function learnPreference(){if(!preferences.enabled)return;preferences.usage=Math.min(10000,preferences.usage+1);savePreferences()}
function exportPreferences(){const payload={format:'atlas-team-preferences-v1',exportedAt:new Date().toISOString(),preferences:{...preferences}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='atlas-team-preferences.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function importPreferencesText(raw){const payload=JSON.parse(raw);if(payload?.format!=='atlas-team-preferences-v1'||!payload.preferences||typeof payload.preferences!=='object')throw Error('Unsupported TEAM preferences file');const p=payload.preferences;if(typeof p.enabled!=='boolean'||!['concise','detailed','professional'].includes(p.tone)||!['cards','tables'].includes(p.layout)||typeof p.focus!=='string'||p.focus.length>240)throw Error('Invalid preference fields');preferences={enabled:p.enabled,tone:p.tone,layout:p.layout,focus:p.focus,usage:Number.isInteger(p.usage)?Math.max(0,Math.min(p.usage,10000)):0};savePreferences()}
const COLLAB_KEY='atlas-team-collaboration-v1';
function readCollab(){try{const a=JSON.parse(localStorage.getItem(COLLAB_KEY)||'[]');return Array.isArray(a)?a.slice(-100).filter(x=>x&&typeof x==='object'):[]}catch{return []}}
function writeCollab(a){localStorage.setItem(COLLAB_KEY,JSON.stringify(a.slice(-100)))}
function renderCollab(){const el=document.getElementById('collabMessages');if(!el)return;const messages=readCollab();el.innerHTML=messages.length?messages.slice().reverse().map(m=>'<div class="card" style="margin:9px 0"><b>'+esc(m.persona)+' · '+esc(m.project)+'</b><small>'+esc(m.kind)+' · '+esc(m.at)+'</small><p>'+esc(m.message)+'</p></div>').join(''):'<p>No project-room messages yet.</p>'}
function render(){document.getElementById('nav').innerHTML=Object.entries(views).map(([k,v])=>'<button class="'+(k===current?'on':'')+'" data-view="'+k+'">'+esc(v)+'</button>').join('');document.getElementById('heading').textContent=views[current];document.getElementById('metrics').innerHTML=[['Specialists',roles.length],['Projects',state.projects.length],['Tasks',state.tasks.length],['AI models online','Not connected']].map(([k,v])=>'<div class="metric"><span>'+k+'</span><b>'+esc(v)+'</b></div>').join('');
const taskRows=state.tasks.map(t=>'<tr><td>'+esc(t.title)+'</td><td>'+esc(t.agent)+'</td><td>'+esc(t.priority)+'</td><td><span class="tag">'+esc(t.status)+'</span> · '+esc(t.approval)+'</td></tr>').join('');
let html='';
if(current==='overview')html='<div class="panel"><h3>Mission control</h3><p>Track assignments, capabilities, and organizational readiness. This is a local prototype; personas are profiles, not autonomous running agents.</p></div><div class="panel"><h3>Priority task queue</h3><table><thead><tr><th>Task</th><th>Owner</th><th>Priority</th><th>Status</th></tr></thead><tbody>'+taskRows+'</tbody></table></div>';
if(current==='workforce')html='<div class="panel"><h3>Specialist registry</h3><p>Expandable role profiles. Runtime and model credentials still need configuration.</p><div class="cards">'+roles.map((r,i)=>'<div class="card"><b>'+esc(r)+'</b><small>Persona '+(i+1)+' • Profile configured</small></div>').join('')+'</div></div>';
if(current==='projects')html='<div class="panel"><h3>Portfolio</h3><div class="cards">'+state.projects.map(p=>'<div class="card"><b>'+esc(p.name)+'</b><small>'+esc(p.status)+'</small></div>').join('')+'</div><form id="projectform"><input name="name" placeholder="New project name" required><button class="button">Add project</button></form></div>';
if(current==='tasks')html='<div class="panel"><h3>Work assignments</h3><table><thead><tr><th>Task</th><th>Specialist</th><th>Priority</th><th>Status</th></tr></thead><tbody>'+taskRows+'</tbody></table><h3 style="margin-top:30px">Create task</h3><form id="taskform"><input name="title" required placeholder="Task title"><select name="agent">'+roles.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><select name="priority"><option>Medium</option><option>High</option><option>Critical</option><option>Low</option></select><button class="button">Add task</button></form></div>';
if(current==='models')html='<div class="panel"><h3>Model policy & provider readiness</h3><p>Inspect the server model allowlist and execution limits. A configured provider is not proof of available credits or tested inference.</p><form id="policyform"><input type="password" autocomplete="off" name="token" placeholder="Operator token" required><button class="button">Inspect model policy</button></form><div id="policyResults"></div></div>';
if(current==='audit')html='<div class="panel"><h3>Governance & local history</h3><p>Browser-local approval and history are demonstrators, not authenticated or tamper-proof records.</p><table><thead><tr><th>Time</th><th>Action</th><th>Details</th></tr></thead><tbody>'+state.activity.map(a=>'<tr><td>'+esc(a.at)+'</td><td>'+esc(a.kind)+'</td><td>'+esc(a.description)+'</td></tr>').join('')+'</tbody></table></div>';
if(current==='recovery')html='<div class="panel"><h3>Stalled task recovery</h3><p>Review stalled executions, then explicitly mark them for investigation. This does not retry or rerun model requests.</p><form id="recoverconnect"><input name="token" type="password" autocomplete="off" placeholder="Operator token" required><button class="button">Inspect stalled tasks</button></form><div id="recoveryResults"></div></div>';
if(current==='readiness')html='<div class="panel"><h3>Production release gates</h3><p>These checks report configuration readiness only—not proof of functioning database, provider, security, or offline inference.</p><form id="readinessform"><input type="password" name="token" autocomplete="off" placeholder="Operator token" required><button class="button">Inspect readiness</button></form><div id="readinessResults"></div></div>';
if(current==='personalization')html='<div class="panel"><h3>Personalization & habit learning</h3><p>Choose what TEAM remembers about the way you work. Learning is OFF by default, saved only in this browser, and is not shared with AI providers. You control and can erase it at any time.</p><form id="prefform"><label><input type="checkbox" name="enabled" '+(preferences.enabled?'checked':'')+'> Enable learning from your use of this browser</label><p><label>Response style <select name="tone"><option value="concise" '+(preferences.tone==='concise'?'selected':'')+'>Concise</option><option value="detailed" '+(preferences.tone==='detailed'?'selected':'')+'>Detailed</option><option value="professional" '+(preferences.tone==='professional'?'selected':'')+'>Professional</option></select></label></p><p><label>Preferred presentation <select name="layout"><option value="cards" '+(preferences.layout==='cards'?'selected':'')+'>Clean cards</option><option value="tables" '+(preferences.layout==='tables'?'selected':'')+'>Tables</option></select></label></p><p><label>Work priorities <input name="focus" maxlength="240" placeholder="Projects and routines to prioritize" value="'+esc(preferences.focus)+'"></label></p><button class="button">Save preferences</button> <button class="button" type="button" id="forgetprefs">Erase saved preferences</button> <button class="button" type="button" id="exportprefs">Export my preferences</button><p><label>Restore exported preferences <input id="importprefs" type="file" accept=".json,application/json"></label></p></form><p id="prefStatus">Observed workspace interactions: '+esc(preferences.usage)+' (local counter only). No cross-device learning or autonomous profiling is active.</p></div>';
if(current==='help')html='<div class="panel"><h3>TEAM Help & Assistance</h3><p>Ask about TEAM features, deployment status, permissions, or how to prepare work. This panel offers built-in guidance; live AI conversation requires a connected model and approved execution workflow.</p><form id="helpform"><input name="question" maxlength="500" placeholder="What do you need help with?" required style="min-width:280px;flex:1"><button class="button">Get guidance</button></form><div id="helpResults" style="margin-top:18px"></div><div class="card" style="margin-top:14px"><b>Need an actionable plan?</b><p>Describe the mission, then generate a proposed specialist plan. No agents execute without your approval.</p><form id="helpplanform"><input name="goal" minlength="8" maxlength="500" required placeholder="What should TEAM plan?" style="min-width:280px;flex:1"><button class="button">Draft mission plan</button></form><div id="helpPlanResults" style="margin-top:12px"></div></div></div><div class="panel"><h3>AI assistance status</h3><p>Model conversation: not connected. For actual model-generated work, use Server Tasks with an authenticated operator and owner approval. No automatic email sending, replicas, or account changes.</p></div>';
if(current==='collaboration')html='<div class="panel"><h3>Persona project room</h3><p>Organize project questions, blockers and handoffs among specialist personas. This is a browser-local collaboration prototype, not a live multi-agent chat. No autonomous agents are sending or receiving messages yet.</p><form id="collabform"><select name="persona" required><option>Chief of Staff</option><option>Research Director</option><option>Software Engineer</option><option>QA Engineer</option><option>Deployment Engineer</option><option>Microsoft 365 Triage</option><option>Security Reviewer</option></select><input name="project" maxlength="80" placeholder="Project / mission" required style="min-width:170px"><input name="message" maxlength="800" placeholder="Question, update, blocker or handoff" required style="min-width:260px;flex:1"><select name="kind"><option value="update">Update</option><option value="question">Team question</option><option value="handoff">Handoff</option><option value="blocked">Blocker</option><option value="owner">Request owner help</option></select><button class="button">Add to project room</button></form><div id="collabMessages" style="margin-top:18px"></div><p><button type="button" class="button" id="clearcollab">Clear local project room</button></p></div>';
if(current==='planner')html='<div class="panel"><h3>Multi-specialist mission planner</h3><p>Generate a staged plan and dependency graph, with each assignment awaiting human approval. This is a planning tool; it does not run autonomous agents.</p><form id="missionform"><input name="token" type="password" autocomplete="off" placeholder="Operator token (not stored)" required style="min-width:220px"><input name="goal" placeholder="Describe your mission" minlength="8" maxlength="1200" required style="min-width:280px;flex:1"><button class="button">Generate plan</button></form><div id="missionResults" style="margin-top:18px"></div></div>';
if(current==='server')html='<div class="panel"><h3>Server-side workforce tasks</h3><p>Uses the authenticated TEAM task API and dedicated PostgreSQL database when configured. Unlike Local Task Queue, tasks and approvals are stored on the server. An operator token stays only in this page session.</p><form id="serverconnect"><input type="password" name="token" autocomplete="off" placeholder="TEAM operator token" required style="min-width:270px;flex:1"><button class="button">Connect & load</button></form><p id="serverStatus">Not connected</p><div id="serverTasks"></div></div>';
if(current==='execution')html='<div class="panel"><h3>Approval-gated AI execution</h3><p>The earlier checkbox-only execution route has been retired. To execute a model task, open Server Tasks, authenticate, create the task, approve it in the server database, then explicitly run that approved task.</p><p>Requires dedicated TEAM database, operator token and server-side model credentials. TEAM does not run background agents or external actions.</p><button class="button" id="goServer">Open Server Tasks</button></div>';
if(current==='routing')html='<div class="panel"><h3>Human-reviewed specialist routing</h3><p>Routes task requests using transparent keyword matching. Nothing is executed automatically. Approvals are saved only in this browser.</p><form id="routeform"><input name="title" style="min-width:280px;flex:1" placeholder="Describe work to route" required><button class="button">Find specialists</button></form><div id="routeOutput" style="margin-top:18px"></div></div><div class="panel"><h3>Approval queue</h3>'+state.tasks.map(t=>'<div class="card" style="margin:10px 0"><b>'+esc(t.title)+'</b><small>Owner: '+esc(t.agent)+' · '+esc(t.approval)+'</small><button class="button" data-approve="'+esc(t.id)+'" '+(t.approval==='approved'?'disabled':'')+' style="margin-top:10px">Approve assignment</button></div>').join('')+'</div>';
if(current==='microsoft')html='<div class="panel"><h3>Microsoft 365 · Command & Assignments</h3><p>Connect your Microsoft account through approved integrations before monitoring begins. No mailbox, Teams messages, or Microsoft tasks are connected to this web application yet.</p><div class="cards"><div class="card"><b>Outlook Mail</b><small>Connection needed · Flag actionable emails, deadlines and replies</small><p><a href="https://outlook.office.com/mail/" target="_blank" rel="noopener noreferrer">Open Outlook</a></p></div><div class="card"><b>Teams</b><small>Connection needed · Monitor mentions, messages and action requests</small><p><a href="https://teams.microsoft.com/" target="_blank" rel="noopener noreferrer">Open Teams</a></p></div><div class="card"><b>Planner & To Do</b><small>Connection needed · Review assignments, owners, priorities and due dates</small><p><a href="https://planner.cloud.microsoft/" target="_blank" rel="noopener noreferrer">Open Planner</a></p></div><div class="card"><b>Outlook Calendar</b><small>Connection needed · Meeting preparation and scheduling conflicts</small><p><a href="https://outlook.office.com/calendar/" target="_blank" rel="noopener noreferrer">Open Calendar</a></p></div><div class="card"><b>OneDrive</b><small>Connection needed · Draft documents and organize reference files</small><p><a href="https://onedrive.live.com/" target="_blank" rel="noopener noreferrer">Open OneDrive</a></p></div><div class="card"><b>SharePoint</b><small>Connection needed · Team files and knowledge searches</small><p><a href="https://www.microsoft365.com/" target="_blank" rel="noopener noreferrer">Open Microsoft 365</a></p></div></div></div><div class="panel"><h3>Owner authority</h3><p>Your final approval is required for sending messages, committing to tasks, changing meetings, sharing files or granting permissions. Observer and delegated modes require authenticated connection and server-enforced grants before use.</p><span class="tag">Not connected — no mailbox monitoring active here</span></div>';
if(current==='gmail')html='<div class="panel"><h3>Gmail · Side Projects</h3><p>Optional secondary inbox for side projects. Microsoft 365 remains your primary business inbox. No Gmail account is connected to the standalone TEAM application.</p><div class="cards"><div class="card"><b>Connection</b><small>Not connected · Owner consent required</small><p><a href="https://mail.google.com/" target="_blank" rel="noopener noreferrer">Open Gmail</a></p></div><div class="card"><b>Priority</b><small>Low · Keep routine Gmail items below Microsoft work</small></div><div class="card"><b>Permissions</b><small>Read-only by default · Sending messages requires explicit owner approval</small></div><div class="card"><b>Monitoring</b><small>Inactive · Authentication and secure storage must be configured first</small></div></div></div>';
if(current==='sports')html='<div class="panel"><h3>Sports Intelligence Division</h3><p>A dedicated Sports Intelligence Director is proposed to coordinate coverage of all major sports, statistics, available markets, player props and evidence quality. This is a staffing blueprint; no sports agents are running or collecting data yet.</p><div class="cards">'+['Football · NFL, NCAA & FCS','Basketball · NBA, WNBA & NCAA','Baseball & Softball','Hockey · NHL & global','Soccer · All available leagues','Tennis, Table Tennis & Racket','Combat Sports · UFC, MMA & Boxing','Golf, Motorsports, Cricket & Esports','Player Props & Statistics','Market Coverage & Odds Quality','Simulations & Calibration'].map(x=>'<div class="card"><b>'+esc(x)+'</b><small>Proposed specialist · Name pending · Owner approval required</small></div>').join('')+'</div></div><div class="panel"><h3>Persona names</h3><p>When real agents are enabled, each proposed specialist can be asked: “What name would you prefer for yourself?” Suggestions will be presented for your approval. No persona has been contacted yet.</p><span class="tag">Sports Director: proposed · Dedicated role</span></div>';
document.getElementById('view').innerHTML=html;if(current==='collaboration')renderCollab();}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){current=b.dataset.view;render()}});
let sessionToken='';
async function serverCall(path,options={}){const r=await fetch(path,{...options,headers:{Authorization:'Bearer '+sessionToken,...(options.headers||{})},cache:'no-store'});const body=await r.json().catch(()=>({ok:false,error:'invalid_server_response'}));if(!r.ok||!body.ok)throw Error(body.error||'request_failed');return body;}
async function renderServerTasks(){const status=document.getElementById('serverStatus'),root=document.getElementById('serverTasks');if(!status||!root)return;status.textContent='Loading server records…';try{const data=await serverCall('/api/tasks');status.textContent='Connected. '+data.tasks.length+' recent server tasks. Verifying schema…';const check=await serverCall('/api/database-health');status.textContent=check.schemaReady?'Connected and schema verified. '+data.tasks.length+' recent server tasks.':'Database schema incomplete.';root.innerHTML='<form id="servercreate"><input name="title" required minlength="3" maxlength="240" placeholder="New task title" style="flex:1;min-width:220px"><select name="persona">'+roles.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><select name="priority">'+['medium','high','critical','low'].map(x=>'<option>'+x+'</option>').join('')+'</select><button class="button">Create server task</button></form>'+data.tasks.map(t=>'<div class="card" style="margin-top:14px"><b>'+esc(t.title)+'</b><small>'+esc(t.persona)+' · '+esc(t.priority)+' · '+esc(t.approval)+'</small>'+(t.approval==='pending'?'<div style="display:flex;gap:8px;margin-top:10px"><button class="button" data-serverdecision="approved" data-taskid="'+esc(t.id)+'">Approve</button><button class="button" data-serverdecision="rejected" data-taskid="'+esc(t.id)+'">Reject</button></div>':(t.approval==='approved'&&t.status==='queued'?'<button class="button" style="margin-top:10px" data-runserver="'+esc(t.id)+'">Run approved model task</button>':''))+'</div>').join('')}catch(error){status.textContent='Server tasks unavailable: '+error.message;root.innerHTML='';}}
document.getElementById('view').addEventListener('change',async e=>{if(e.target.id!=='importprefs')return;const file=e.target.files?.[0];if(!file)return;const status=document.getElementById('prefStatus');if(file.size>8192){status.textContent='Import rejected: file too large';return}try{importPreferencesText(await file.text());render();document.getElementById('prefStatus').textContent='Preferences restored to this browser.'}catch(error){status.textContent='Import rejected: '+error.message}});
document.getElementById('view').addEventListener('submit',async e=>{e.preventDefault();if(e.target.id==='recoverconnect'){const d=new FormData(e.target),output=document.getElementById('recoveryResults');sessionToken=String(d.get('token'));e.target.reset();try{const result=await serverCall('/api/stalled-tasks');output.innerHTML='<p>'+esc(result.count)+' stalled tasks require review.</p>'+result.stalled.map(t=>'<div class="card" style="margin:10px 0"><b>'+esc(t.title)+'</b><small>'+esc(t.persona)+' · '+esc(t.id)+'</small><button class="button" data-markreview="'+esc(t.id)+'">Mark for manual review (no retry)</button></div>').join('')}catch(error){output.textContent='Recovery check unavailable: '+error.message}return}if(e.target.id==='policyform'){const d=new FormData(e.target),target=document.getElementById('policyResults');try{const r=await fetch('/api/model-policy',{headers:{authorization:'Bearer '+d.get('token')},cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'unavailable');const p=j.policy;target.innerHTML='<div class="cards"><div class="card"><b>'+esc(p.model)+'</b><small>Selected model · '+(p.allowed?'Allowlisted':'Not allowlisted')+'</small></div><div class="card"><b>'+esc(p.maxOutputTokens)+'</b><small>Maximum output tokens / request</small></div><div class="card"><b>'+esc(p.timeoutMs)+' ms</b><small>Request timeout</small></div></div><p>'+(p.providerConfigured?'Provider key configured':'Provider key missing')+' · Spend enforcement not implemented</p>'}catch(error){target.textContent='Policy unavailable: '+error.message}finally{e.target.reset()}return}if(e.target.id==='readinessform'){const form=e.target,d=new FormData(form),target=document.getElementById('readinessResults');target.textContent='Checking…';try{const r=await fetch('/api/readiness',{headers:{authorization:'Bearer '+d.get('token')},cache:'no-store'}),data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||'unavailable');target.innerHTML='<p>Minimum configuration: '+(data.readiness.operational?'present':'incomplete')+'</p>'+data.readiness.checks.map(c=>'<div class="card" style="margin:8px 0"><b>'+esc(c.id)+'</b><small>'+(c.ready?'Configuration present':'Not configured')+(c.required?' · Required':' · Future capability')+'</small></div>').join('')}catch(error){target.textContent='Readiness check unavailable: '+error.message}finally{form.reset()}return}if(e.target.id==='prefform'){const d=new FormData(e.target);preferences={...preferences,enabled:d.get('enabled')==='on',tone:String(d.get('tone')),layout:String(d.get('layout')),focus:String(d.get('focus')||'').slice(0,240)};savePreferences();render();document.getElementById('prefStatus').textContent='Preferences saved in this browser. Learning '+(preferences.enabled?'enabled':'disabled')+'.';return}
if(e.target.id==='collabform'){const d=new FormData(e.target);const entry={persona:String(d.get('persona')).slice(0,80),project:String(d.get('project')).trim().slice(0,80),message:String(d.get('message')).trim().slice(0,800),kind:String(d.get('kind')).slice(0,20),at:new Date().toISOString()};if(!entry.project||!entry.message)return;const messages=readCollab();messages.push(entry);writeCollab(messages);e.target.reset();renderCollab();return}
if(e.target.id==='helpplanform'){const form=e.target,out=document.getElementById('helpPlanResults'),goal=String(new FormData(form).get('goal')||'');const button=form.querySelector('button');button.disabled=true;out.textContent='Preparing approval-required plan…';try{const response=await fetch('/api/plan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({goal})});const data=await response.json();if(!response.ok||!data.ok)throw Error(data.error||'planning_unavailable');out.innerHTML='<p>Proposed only · Owner approval required · No execution</p>'+data.plan.stages.map((stage,i)=>'<div class="card" style="margin:8px 0"><b>'+esc(i+1)+'. '+esc(stage.name)+'</b><small>'+esc(stage.role)+' · Approval required · Depends on: '+esc(stage.dependsOn.join(', ')||'none')+'</small></div>').join('')+'<p><button type="button" class="button" id="copyhelpplan">Copy proposed plan</button></p>';window.__teamLastHelpPlan=data.plan}catch(error){out.textContent='Planning not available from this host: '+error.message}finally{button.disabled=false}return}
if(e.target.id==='helpform'){const q=String(new FormData(e.target).get('question')||'').toLowerCase();const out=document.getElementById('helpResults');const answer=q.includes('cloudflare')||q.includes('deploy')?'Cloudflare publishing requires credentials in GitHub Actions; a passing test does not establish a live deployment.':q.includes('microsoft')||q.includes('outlook')||q.includes('teams')?'Microsoft 365 integration requires owner consent and secure sign-in before TEAM can read your account.':q.includes('permission')||q.includes('approv')?'You remain final authority. Proposed plans do not execute automatically; sensitive actions require your approval.':q.includes('habit')||q.includes('learn')?'Open My Preferences to opt into browser-local learning, choose your style, and erase your data at any time.':'I can point you to Mission Planner, My Preferences, Microsoft 365, or Server Tasks. Model-generated answers are not connected yet.';learnPreference();const profile=preferences.enabled?'<p><b>Your preferences:</b> '+esc(preferences.tone)+' responses · '+esc(preferences.layout)+' layout'+(preferences.focus?' · Focus: '+esc(preferences.focus):'')+'</p>':'';out.innerHTML='<div class="card"><b>Built-in guidance (not an AI model response)</b><p>'+esc(answer)+'</p>'+profile+'<small>To request specialist work, open Mission Planner. Live conversational AI remains unconfigured.</small></div>';return}
if(e.target.id==='missionform'){const form=e.target,d=new FormData(form),out=document.getElementById('missionResults'),button=form.querySelector('button');button.disabled=true;out.textContent='Generating stage plan…';try{const response=await fetch('/api/plan',{method:'POST',headers:{authorization:'Bearer '+d.get('token'),'content-type':'application/json'},body:JSON.stringify({goal:d.get('goal')})});const body=await response.json();if(!response.ok||!body.ok)throw Error(body.error||'planner_unavailable');out.innerHTML='<p>Review only · No work executed</p>'+body.plan.stages.map((p,i)=>'<div class="card" style="margin:12px 0"><b>'+esc(i+1)+'. '+esc(p.name)+'</b><small>Owner: '+esc(p.role)+' · Requires approval · Dependencies: '+esc(p.dependsOn.join(', ')||'none')+'</small></div>').join('')}catch(error){out.textContent='Planner unavailable: '+error.message}finally{button.disabled=false;form.querySelector('[name=token]').value=''}return}if(e.target.id==='serverconnect'){sessionToken=String(new FormData(e.target).get('token'));e.target.reset();await renderServerTasks();return}if(e.target.id==='servercreate'){const d=new FormData(e.target),button=e.target.querySelector('button');button.disabled=true;try{await serverCall('/api/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:d.get('title'),persona:d.get('persona'),priority:d.get('priority')})});await renderServerTasks()}catch(error){document.getElementById('serverStatus').textContent='Task creation failed: '+error.message}finally{button.disabled=false}return}if(e.target.id==='executef'){const form=e.target,d=new FormData(form),result=document.getElementById('modelResult'),button=form.querySelector('button');button.disabled=true;result.textContent='Sending approved request…';try{const r=await fetch('/api/execute',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+d.get('token')},body:JSON.stringify({task:String(d.get('task')),persona:String(d.get('persona')),approved:d.get('approved')==='on'})});const response=await r.json();result.textContent=response.ok?response.result||'Model returned no text.':response.error||'Request unsuccessful';if(response.ok){audit('model-response','Completed model response for '+String(d.get('persona')));save()}}catch{result.textContent='Could not reach model backend.'}finally{button.disabled=false}return}const f=e.target,d=new FormData(f);if(f.id==='taskform'){const title=String(d.get('title')).slice(0,140);state.tasks.push({id:'task-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),title,agent:String(d.get('agent')),priority:String(d.get('priority')),status:'Queued',approval:'pending'});audit('task-created',title)}if(f.id==='projectform'){const name=String(d.get('name')).slice(0,100);state.projects.push({name,status:'Planned'});audit('project-created',name)}if(f.id==='routeform'){const title=String(d.get('title')).slice(0,140),matches=propose(title);const output=document.getElementById('routeOutput');output.innerHTML=matches.length?'<h3>Recommended specialists</h3>'+matches.map(x=>'<div class="card" style="margin:10px 0"><b>'+esc(x.name)+'</b><small>Matched: '+esc(x.matches.join(', '))+'</small><button class="button" data-create-route="'+esc(x.name)+'">Queue assignment</button></div>').join(''):'<p>No strong keyword match; human assignment required.</p>';output.dataset.title=title;return}save();render()});
document.getElementById('view').addEventListener('click',async e=>{if(e.target.id==='copyhelpplan'){if(window.__teamLastHelpPlan){const p=window.__teamLastHelpPlan;const t='TEAM proposed plan (not approved or executed)\nGoal: '+p.goal+'\n'+p.stages.map((v,i)=>(i+1)+'. '+v.name+' — '+v.role+' (approval required)').join('\n');try{await navigator.clipboard.writeText(t);e.target.textContent='Copied'}catch{e.target.textContent='Copy unavailable'}}return}if(e.target.id==='exportprefs'){exportPreferences();return}if(e.target.id==='clearcollab'){if(confirm('Erase this browser local project-room history?')){localStorage.removeItem(COLLAB_KEY);renderCollab()}return}if(e.target.id==='forgetprefs'){localStorage.removeItem(PREF_KEY);preferences=loadPreferences();render();return}const mark=e.target.closest('[data-markreview]');if(mark){if(!confirm('Mark this stalled execution for manual review? No retry will be attempted.'))return;mark.disabled=true;try{await serverCall('/api/task-recover',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({taskId:mark.dataset.markreview,confirmNoRetry:true})});mark.closest('.card').remove()}catch(error){alert('Recovery update failed: '+error.message);mark.disabled=false}return}if(e.target.id==='goServer'){current='server';render();return}const runButton=e.target.closest('[data-runserver]');if(runButton){if(!confirm('Execute this already-approved task once using the configured paid AI provider?'))return;runButton.disabled=true;const status=document.getElementById('serverStatus');status.textContent='Submitting approved model task…';try{const result=await serverCall('/api/execute-approved',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({taskId:runButton.dataset.runserver})});await renderServerTasks();const output=document.createElement('pre');output.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;color:#c3d9f7';output.textContent=result.result||'No text returned';document.getElementById('serverTasks').prepend(output)}catch(error){status.textContent='Execution unavailable: '+error.message;runButton.disabled=false}return}const serverButton=e.target.closest('[data-serverdecision]');if(serverButton){if(!confirm('Record this '+serverButton.dataset.serverdecision+' decision on the server?'))return;serverButton.disabled=true;try{await serverCall('/api/approve',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({taskId:serverButton.dataset.taskid,decision:serverButton.dataset.serverdecision})});await renderServerTasks()}catch(error){document.getElementById('serverStatus').textContent='Decision failed: '+error.message;serverButton.disabled=false}return}const a=e.target.closest('[data-approve]');if(a){const t=state.tasks.find(x=>x.id===a.dataset.approve);if(t){t.approval='approved';audit('assignment-approved',t.title);save();render()}return}const b=e.target.closest('[data-create-route]');if(b){const title=document.getElementById('routeOutput')?.dataset.title;if(!title)return;state.tasks.push({id:'task-'+Date.now(),title,agent:b.dataset.createRoute,priority:'Medium',status:'Queued',approval:'pending'});audit('assignment-proposed',title+' -> '+b.dataset.createRoute);save();render()}});
const importer=document.createElement('input');importer.type='file';importer.accept='application/json';importer.style.display='none';document.body.appendChild(importer);
const importButton=document.createElement('button');importButton.className='button';importButton.textContent='Import data';document.getElementById('export').before(importButton);
importButton.onclick=()=>importer.click();
importer.onchange=async()=>{const file=importer.files?.[0];if(!file)return;try{if(file.size>1000000)throw Error('File exceeds 1 MB');const value=JSON.parse(await file.text());if(!Array.isArray(value.projects)||!Array.isArray(value.tasks)||value.projects.length>1000||value.tasks.length>3000)throw Error('Invalid TEAM export');if(!value.projects.every(p=>p&&typeof p.name==='string')||!value.tasks.every(t=>t&&typeof t.title==='string'))throw Error('Malformed projects or tasks');if(!confirm('Replace local TEAM projects and tasks with imported data?'))return;state={projects:value.projects.map(p=>({name:p.name.slice(0,100),status:String(p.status||'Planned').slice(0,30)})),tasks:value.tasks.map((t,i)=>({id:'import-'+i,title:t.title.slice(0,140),agent:roles.includes(t.agent)?t.agent:'Chief Architect',priority:['Low','Medium','High','Critical'].includes(t.priority)?t.priority:'Medium',status:'Queued',approval:'pending'})),activity:[]};audit('import','Imported browser-local project and task records; approvals reset');save();render()}catch(error){alert('Import rejected: '+error.message)}finally{importer.value=''}};
document.getElementById('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='atlas-team-export.json';a.click();URL.revokeObjectURL(url)});render();
</script></body></html>
