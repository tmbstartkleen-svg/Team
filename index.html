<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATLAS TEAM | Workforce OS</title>
<style>
:root{font-family:Inter,system-ui,Arial;background:#09111f;color:#edf4ff}*{box-sizing:border-box}body{margin:0}.shell{display:flex;min-height:100vh}aside{width:245px;background:#111c2e;border-right:1px solid #293d58;padding:25px 15px;flex-shrink:0}aside h2{letter-spacing:3px;margin:0 0 3px}aside small{color:#91a9c9}.nav{margin-top:45px;display:grid;gap:6px}.nav button{background:none;color:#b1c4dc;border:0;text-align:left;padding:15px;border-radius:8px;font-size:14px;cursor:pointer}.nav button:hover,.nav button.on{background:#27405e;color:white}main{flex:1;padding:36px clamp(20px,4vw,65px);min-width:0}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.ey{color:#7da9dd;font-size:11px;font-weight:750;letter-spacing:1.5px}h1{font-size:34px;margin:10px 0 6px}p{color:#9db0cc}.button{background:#6db9fb;border:0;color:#071324;border-radius:9px;padding:12px 17px;font-weight:750;cursor:pointer}.metrics,.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:27px 0}.panel,.metric{border:1px solid #304561;background:#142238;border-radius:14px;padding:22px}.metric b{display:block;font-size:29px;margin:12px 0}.metric span,.muted{color:#95a9c5;font-size:12px}.panel{margin:20px 0}.panel h3{margin-top:0}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:16px;border:1px solid #354c68;border-radius:10px;background:#182b45}.card small{display:block;color:#9caeca;margin-top:8px}.tag{display:inline-block;background:#233e59;border-radius:50px;padding:6px 11px;font-size:11px;color:#a3d6ff}input,select{background:#0c1728;border:1px solid #47607f;border-radius:9px;color:white;padding:12px;font:inherit}form{display:flex;gap:10px;flex-wrap:wrap}table{border-collapse:collapse;width:100%;text-align:left}td,th{padding:15px;border-bottom:1px solid #2a415b;font-size:13px}th{color:#91aad0}@media(max-width:850px){.shell{display:block}aside{width:auto}.nav{display:flex;overflow:auto;margin-top:18px}.metrics{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}main{padding:23px}}
</style></head><body><div class="shell"><aside><h2>ATLAS</h2><small>TEAM • AI WORKFORCE OS</small><div class="nav" id="nav"></div><p class="muted" style="margin-top:50px">Local prototype • No cloud model execution connected</p></aside><main><header><div><span class="ey">EXECUTIVE INTELLIGENCE WORKSPACE</span><h1 id="heading">Command Center</h1><p id="subtitle">Independent workforce orchestration workspace</p></div><button class="button" id="export">Export data</button></header><div class="metrics" id="metrics"></div><section id="view"></section></main></div>
<script>
const roles=['Chief Architect','Team Assembler','Program Manager','Research Director','Data Analyst','Software Engineer','Product Designer','QA Engineer','Security Reviewer','Deployment Engineer','Model Steward','Offline Engineer','Integration Engineer','Compliance Auditor','Financial Analyst','Sales Strategist','Operations Manager','Documentation Lead'];
const defaults={projects:[{name:'TEAM Platform',status:'In progress'},{name:'Multi-model Fabric',status:'Planned'},{name:'Offline Agent Runtime',status:'Planned'}],tasks:[{title:'Implement real model connections',agent:'Model Steward',priority:'High',status:'Queued'},{title:'Deploy independent TEAM runtime',agent:'Deployment Engineer',priority:'High',status:'Queued'}]};
let state;try{state=JSON.parse(localStorage.getItem('atlas-team-v2'))||localStorage.getItem('atlas-team-v1')&&JSON.parse(localStorage.getItem('atlas-team-v1'))||structuredClone(defaults)}catch{state=structuredClone(defaults)}
if(!Array.isArray(state.projects))state.projects=[];
if(!Array.isArray(state.tasks))state.tasks=[];
if(!Array.isArray(state.activity))state.activity=[];
state.tasks=state.tasks.map((t,i)=>({...t,id:t.id||'task-'+i,approval:t.approval||'not-requested'}));
const audit=(kind,description)=>{state.activity.unshift({kind,description,at:new Date().toISOString()});state.activity=state.activity.slice(0,200)};
const signals={
'Chief Architect':['architecture','system','roadmap','dependency','design'],
'Team Assembler':['persona','agent','team','workforce'],
'Program Manager':['milestone','plan','schedule','delivery'],
'Research Director':['research','investigate','source','evidence'],
'Data Analyst':['data','analysis','metrics','report'],
'Software Engineer':['code','software','bug','feature','backend','frontend'],
'Product Designer':['ui','ux','interface','layout','visual','accessibility'],
'QA Engineer':['test','quality','regression','verify'],
'Security Reviewer':['security','permissions','secrets','auth'],
'Deployment Engineer':['deploy','vercel','release','production','build','github'],
'Model Steward':['model','gpt','llm','routing','inference','provider'],
'Offline Engineer':['offline','local','device','fallback'],
'Integration Engineer':['connector','integration','webhook','sync','api'],
'Compliance Auditor':['compliance','audit','policy','regulatory'],
'Financial Analyst':['budget','cost','revenue','finance','pricing'],
'Sales Strategist':['sales','customers','leads','proposal'],
'Operations Manager':['operations','process','workflow','handoff'],
'Documentation Lead':['documentation','write','guide','manual']
};
function propose(title){const words=new Set(String(title||'').toLowerCase().match(/[a-z0-9-]+/g)||[]);return roles.map(name=>({name,matches:(signals[name]||[]).filter(w=>words.has(w))})).filter(x=>x.matches.length).sort((a,b)=>b.matches.length-a.matches.length||a.name.localeCompare(b.name)).slice(0,4)}

const save=()=>localStorage.setItem('atlas-team-v2',JSON.stringify(state));
const views={overview:'Command Center',workforce:'Workforce',projects:'Projects',tasks:'Task Queue',models:'Model Fabric',audit:'Governance',routing:'Task Routing',execution:'AI Execution',server:'Server Tasks'};
let current='overview';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.getElementById('nav').innerHTML=Object.entries(views).map(([k,v])=>'<button class="'+(k===current?'on':'')+'" data-view="'+k+'">'+esc(v)+'</button>').join('');document.getElementById('heading').textContent=views[current];document.getElementById('metrics').innerHTML=[['Specialists',roles.length],['Projects',state.projects.length],['Tasks',state.tasks.length],['AI models online','Not connected']].map(([k,v])=>'<div class="metric"><span>'+k+'</span><b>'+esc(v)+'</b></div>').join('');
const taskRows=state.tasks.map(t=>'<tr><td>'+esc(t.title)+'</td><td>'+esc(t.agent)+'</td><td>'+esc(t.priority)+'</td><td><span class="tag">'+esc(t.status)+'</span> · '+esc(t.approval)+'</td></tr>').join('');
let html='';
if(current==='overview')html='<div class="panel"><h3>Mission control</h3><p>Track assignments, capabilities, and organizational readiness. This is a local prototype; personas are profiles, not autonomous running agents.</p></div><div class="panel"><h3>Priority task queue</h3><table><thead><tr><th>Task</th><th>Owner</th><th>Priority</th><th>Status</th></tr></thead><tbody>'+taskRows+'</tbody></table></div>';
if(current==='workforce')html='<div class="panel"><h3>Specialist registry</h3><p>Expandable role profiles. Runtime and model credentials still need configuration.</p><div class="cards">'+roles.map((r,i)=>'<div class="card"><b>'+esc(r)+'</b><small>Persona '+(i+1)+' • Profile configured</small></div>').join('')+'</div></div>';
if(current==='projects')html='<div class="panel"><h3>Portfolio</h3><div class="cards">'+state.projects.map(p=>'<div class="card"><b>'+esc(p.name)+'</b><small>'+esc(p.status)+'</small></div>').join('')+'</div><form id="projectform"><input name="name" placeholder="New project name" required><button class="button">Add project</button></form></div>';
if(current==='tasks')html='<div class="panel"><h3>Work assignments</h3><table><thead><tr><th>Task</th><th>Specialist</th><th>Priority</th><th>Status</th></tr></thead><tbody>'+taskRows+'</tbody></table><h3 style="margin-top:30px">Create task</h3><form id="taskform"><input name="title" required placeholder="Task title"><select name="agent">'+roles.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><select name="priority"><option>Medium</option><option>High</option><option>Critical</option><option>Low</option></select><button class="button">Add task</button></form></div>';
if(current==='models')html='<div class="panel"><h3>Model fabric</h3><p>Architecture placeholders only. No API credentials, provider integrations, model subscriptions or local inference engines are supplied by this prototype.</p><div class="cards"><div class="card">Cloud models<small>Connection required</small></div><div class="card">Local models<small>Installation required</small></div><div class="card">Capability router<small>Implementation pending</small></div></div></div>';
if(current==='audit')html='<div class="panel"><h3>Governance & local history</h3><p>Browser-local approval and history are demonstrators, not authenticated or tamper-proof records.</p><table><thead><tr><th>Time</th><th>Action</th><th>Details</th></tr></thead><tbody>'+state.activity.map(a=>'<tr><td>'+esc(a.at)+'</td><td>'+esc(a.kind)+'</td><td>'+esc(a.description)+'</td></tr>').join('')+'</tbody></table></div>';
if(current==='server')html='<div class="panel"><h3>Server-side workforce tasks</h3><p>Uses the authenticated TEAM task API and dedicated PostgreSQL database when configured. Unlike Local Task Queue, tasks and approvals are stored on the server. An operator token stays only in this page session.</p><form id="serverconnect"><input type="password" name="token" autocomplete="off" placeholder="TEAM operator token" required style="min-width:270px;flex:1"><button class="button">Connect & load</button></form><p id="serverStatus">Not connected</p><div id="serverTasks"></div></div>';
if(current==='execution')html='<div class="panel"><h3>Approval-gated AI execution</h3><p>The earlier checkbox-only execution route has been retired. To execute a model task, open Server Tasks, authenticate, create the task, approve it in the server database, then explicitly run that approved task.</p><p>Requires dedicated TEAM database, operator token and server-side model credentials. TEAM does not run background agents or external actions.</p><button class="button" id="goServer">Open Server Tasks</button></div>';
if(current==='routing')html='<div class="panel"><h3>Human-reviewed specialist routing</h3><p>Routes task requests using transparent keyword matching. Nothing is executed automatically. Approvals are saved only in this browser.</p><form id="routeform"><input name="title" style="min-width:280px;flex:1" placeholder="Describe work to route" required><button class="button">Find specialists</button></form><div id="routeOutput" style="margin-top:18px"></div></div><div class="panel"><h3>Approval queue</h3>'+state.tasks.map(t=>'<div class="card" style="margin:10px 0"><b>'+esc(t.title)+'</b><small>Owner: '+esc(t.agent)+' · '+esc(t.approval)+'</small><button class="button" data-approve="'+esc(t.id)+'" '+(t.approval==='approved'?'disabled':'')+' style="margin-top:10px">Approve assignment</button></div>').join('')+'</div>';
document.getElementById('view').innerHTML=html;}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){current=b.dataset.view;render()}});
let sessionToken='';
async function serverCall(path,options={}){const r=await fetch(path,{...options,headers:{Authorization:'Bearer '+sessionToken,...(options.headers||{})},cache:'no-store'});const body=await r.json().catch(()=>({ok:false,error:'invalid_server_response'}));if(!r.ok||!body.ok)throw Error(body.error||'request_failed');return body;}
async function renderServerTasks(){const status=document.getElementById('serverStatus'),root=document.getElementById('serverTasks');if(!status||!root)return;status.textContent='Loading server records…';try{const data=await serverCall('/api/tasks');status.textContent='Connected. '+data.tasks.length+' recent server tasks. Verifying schema…';const check=await serverCall('/api/database-health');status.textContent=check.schemaReady?'Connected and schema verified. '+data.tasks.length+' recent server tasks.':'Database schema incomplete.';root.innerHTML='<form id="servercreate"><input name="title" required minlength="3" maxlength="240" placeholder="New task title" style="flex:1;min-width:220px"><select name="persona">'+roles.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><select name="priority">'+['medium','high','critical','low'].map(x=>'<option>'+x+'</option>').join('')+'</select><button class="button">Create server task</button></form>'+data.tasks.map(t=>'<div class="card" style="margin-top:14px"><b>'+esc(t.title)+'</b><small>'+esc(t.persona)+' · '+esc(t.priority)+' · '+esc(t.approval)+'</small>'+(t.approval==='pending'?'<div style="display:flex;gap:8px;margin-top:10px"><button class="button" data-serverdecision="approved" data-taskid="'+esc(t.id)+'">Approve</button><button class="button" data-serverdecision="rejected" data-taskid="'+esc(t.id)+'">Reject</button></div>':(t.approval==='approved'&&t.status==='queued'?'<button class="button" style="margin-top:10px" data-runserver="'+esc(t.id)+'">Run approved model task</button>':''))+'</div>').join('')}catch(error){status.textContent='Server tasks unavailable: '+error.message;root.innerHTML='';}}
document.getElementById('view').addEventListener('submit',async e=>{e.preventDefault();if(e.target.id==='serverconnect'){sessionToken=String(new FormData(e.target).get('token'));e.target.reset();await renderServerTasks();return}if(e.target.id==='servercreate'){const d=new FormData(e.target),button=e.target.querySelector('button');button.disabled=true;try{await serverCall('/api/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:d.get('title'),persona:d.get('persona'),priority:d.get('priority')})});await renderServerTasks()}catch(error){document.getElementById('serverStatus').textContent='Task creation failed: '+error.message}finally{button.disabled=false}return}if(e.target.id==='executef'){const form=e.target,d=new FormData(form),result=document.getElementById('modelResult'),button=form.querySelector('button');button.disabled=true;result.textContent='Sending approved request…';try{const r=await fetch('/api/execute',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+d.get('token')},body:JSON.stringify({task:String(d.get('task')),persona:String(d.get('persona')),approved:d.get('approved')==='on'})});const response=await r.json();result.textContent=response.ok?response.result||'Model returned no text.':response.error||'Request unsuccessful';if(response.ok){audit('model-response','Completed model response for '+String(d.get('persona')));save()}}catch{result.textContent='Could not reach model backend.'}finally{button.disabled=false}return}const f=e.target,d=new FormData(f);if(f.id==='taskform'){const title=String(d.get('title')).slice(0,140);state.tasks.push({id:'task-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),title,agent:String(d.get('agent')),priority:String(d.get('priority')),status:'Queued',approval:'pending'});audit('task-created',title)}if(f.id==='projectform'){const name=String(d.get('name')).slice(0,100);state.projects.push({name,status:'Planned'});audit('project-created',name)}if(f.id==='routeform'){const title=String(d.get('title')).slice(0,140),matches=propose(title);const output=document.getElementById('routeOutput');output.innerHTML=matches.length?'<h3>Recommended specialists</h3>'+matches.map(x=>'<div class="card" style="margin:10px 0"><b>'+esc(x.name)+'</b><small>Matched: '+esc(x.matches.join(', '))+'</small><button class="button" data-create-route="'+esc(x.name)+'">Queue assignment</button></div>').join(''):'<p>No strong keyword match; human assignment required.</p>';output.dataset.title=title;return}save();render()});
document.getElementById('view').addEventListener('click',async e=>{if(e.target.id==='goServer'){current='server';render();return}const runButton=e.target.closest('[data-runserver]');if(runButton){if(!confirm('Execute this already-approved task once using the configured paid AI provider?'))return;runButton.disabled=true;const status=document.getElementById('serverStatus');status.textContent='Submitting approved model task…';try{const result=await serverCall('/api/execute-approved',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({taskId:runButton.dataset.runserver})});await renderServerTasks();const output=document.createElement('pre');output.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;color:#c3d9f7';output.textContent=result.result||'No text returned';document.getElementById('serverTasks').prepend(output)}catch(error){status.textContent='Execution unavailable: '+error.message;runButton.disabled=false}return}const serverButton=e.target.closest('[data-serverdecision]');if(serverButton){if(!confirm('Record this '+serverButton.dataset.serverdecision+' decision on the server?'))return;serverButton.disabled=true;try{await serverCall('/api/approve',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({taskId:serverButton.dataset.taskid,decision:serverButton.dataset.serverdecision})});await renderServerTasks()}catch(error){document.getElementById('serverStatus').textContent='Decision failed: '+error.message;serverButton.disabled=false}return}const a=e.target.closest('[data-approve]');if(a){const t=state.tasks.find(x=>x.id===a.dataset.approve);if(t){t.approval='approved';audit('assignment-approved',t.title);save();render()}return}const b=e.target.closest('[data-create-route]');if(b){const title=document.getElementById('routeOutput')?.dataset.title;if(!title)return;state.tasks.push({id:'task-'+Date.now(),title,agent:b.dataset.createRoute,priority:'Medium',status:'Queued',approval:'pending'});audit('assignment-proposed',title+' -> '+b.dataset.createRoute);save();render()}});
const importer=document.createElement('input');importer.type='file';importer.accept='application/json';importer.style.display='none';document.body.appendChild(importer);
const importButton=document.createElement('button');importButton.className='button';importButton.textContent='Import data';document.getElementById('export').before(importButton);
importButton.onclick=()=>importer.click();
importer.onchange=async()=>{const file=importer.files?.[0];if(!file)return;try{if(file.size>1000000)throw Error('File exceeds 1 MB');const value=JSON.parse(await file.text());if(!Array.isArray(value.projects)||!Array.isArray(value.tasks)||value.projects.length>1000||value.tasks.length>3000)throw Error('Invalid TEAM export');if(!value.projects.every(p=>p&&typeof p.name==='string')||!value.tasks.every(t=>t&&typeof t.title==='string'))throw Error('Malformed projects or tasks');if(!confirm('Replace local TEAM projects and tasks with imported data?'))return;state={projects:value.projects.map(p=>({name:p.name.slice(0,100),status:String(p.status||'Planned').slice(0,30)})),tasks:value.tasks.map((t,i)=>({id:'import-'+i,title:t.title.slice(0,140),agent:roles.includes(t.agent)?t.agent:'Chief Architect',priority:['Low','Medium','High','Critical'].includes(t.priority)?t.priority:'Medium',status:'Queued',approval:'pending'})),activity:[]};audit('import','Imported browser-local project and task records; approvals reset');save();render()}catch(error){alert('Import rejected: '+error.message)}finally{importer.value=''}};
document.getElementById('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='atlas-team-export.json';a.click();URL.revokeObjectURL(url)});render();
</script></body></html>
