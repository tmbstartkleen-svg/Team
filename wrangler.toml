name = "atlas-team"
main = "src/cloudflare-worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/__team/*"]

[vars]
TEAM_API_ORIGIN = "https://team-rho-self.vercel.app"
TEAM_INFERENCE_PROVIDER = "cloudflare"
TEAM_GITHUB_READ_REPOSITORIES = "tmbstartkleen-svg/Team"
TEAM_GITHUB_CERTIFICATION_TASK_ID = "cert-github-read-20261018"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "TEAM_CERT_LEDGER"
class_name = "CertificationLedger"

[[migrations]]
tag = "cert-ledger-sqlite-v1"
new_sqlite_classes = ["CertificationLedger"]
