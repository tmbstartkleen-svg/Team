name = "atlas-team"
main = "src/cloudflare-worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/__team/*"]

[vars]
TEAM_API_ORIGIN = "https://team-rho-self.vercel.app"
TEAM_INFERENCE_PROVIDER = "cloudflare"

[ai]
binding = "AI"
